  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-windows
#      - build-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          ns = {"ns": "http://schemas.microsoft.com/appx/manifest/foundation/windows10"}
          tree = ET.parse("EngineeringSupporter.WinUI/Package.appxmanifest")
          identity = tree.getroot().find("ns:Identity", ns)
          if identity is None:
              raise Exception("Identity element not found in manifest")
          version = identity.attrib["Version"]
          print(f"version={version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"version={version}\n")
          PY

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            artifacts/windows-installers/EngineeringSupporter.msix
            artifacts/windows-installers/EngineeringSupporter.appinstaller
#            artifacts/macos-installers/EngineeringSupporter-mac.dmg
