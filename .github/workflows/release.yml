name: Build and Release Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Decode signing certificate
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            throw "WINDOWS_PFX_BASE64 is not set."
          }
          $pfxPath = "$env:GITHUB_WORKSPACE\\build\\signing.pfx"
          New-Item -ItemType Directory -Force -Path (Split-Path $pfxPath) | Out-Null
          $base64String = $env:WINDOWS_PFX_BASE64 -replace '\s',''
          $bytes = [Convert]::FromBase64String($base64String)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Write-Host "PFX written to $pfxPath"

      - name: Import certificate
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:GITHUB_WORKSPACE\build\signing.pfx"
          if (-not $env:WINDOWS_PFX_PASSWORD) {
            throw "WINDOWS_PFX_PASSWORD is not set."
          }
          try {
            $password = $env:WINDOWS_PFX_PASSWORD | ConvertTo-SecureString -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -ErrorAction Stop
            $thumbprint = $cert.Thumbprint
            echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_OUTPUT
            Write-Host "Certificate imported successfully. Thumbprint: $thumbprint"
          } catch {
            Write-Error "Failed to import certificate. Please verify if WINDOWS_PFX_PASSWORD is correct and matches the PFX file."
            throw $_
          }
        id: import_cert

      - name: Publish MSIX (x64)
        run: |
          $appxDir = "$env:GITHUB_WORKSPACE\\artifacts\\windows\\"
          dotnet publish .\\EngineeringSupporter.WinUI\\EngineeringSupporter.WinUI.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -p:Platform=x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="${{ steps.import_cert.outputs.CERT_THUMBPRINT }}" `
            -p:AppxPackageDir="$appxDir"

      - name: Prepare MSIX + AppInstaller assets
        run: |
          $artifactRoot = "$env:GITHUB_WORKSPACE\\artifacts\\windows"
          $msix = Get-ChildItem -Path $artifactRoot -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) {
            throw "MSIX not found under $artifactRoot"
          }
          Copy-Item $msix.FullName (Join-Path $artifactRoot "EngineeringSupporter.msix") -Force

          [xml]$manifest = Get-Content "$env:GITHUB_WORKSPACE\\EngineeringSupporter.WinUI\\Package.appxmanifest"
          $identity = $manifest.Package.Identity
          $name = $identity.Name
          $publisher = $identity.Publisher
          $version = $identity.Version

          $appInstallerPath = Join-Path $artifactRoot "EngineeringSupporter.appinstaller"
          $repo = "${{ github.repository }}"
          $lines = @(
            '<AppInstaller xmlns="http://schemas.microsoft.com/appx/appinstaller/2017/2"',
            "  Version=`"$version`"",
            "  Uri=`"https://github.com/$repo/releases/latest/download/EngineeringSupporter.appinstaller`">",
            '',
            '  <MainPackage',
            "    Name=`"$name`"",
            "    Publisher=`"$publisher`"",
            "    Version=`"$version`"",
            '    ProcessorArchitecture="x64"',
            "    Uri=`"https://github.com/$repo/releases/download/v$version/EngineeringSupporter.msix`" />",
            '',
            '  <UpdateSettings>',
            '    <OnLaunch HoursBetweenUpdateChecks="4" />',
            '  </UpdateSettings>',
            '</AppInstaller>'
          )
          $lines -join "`n" | Set-Content -Path $appInstallerPath -Encoding utf8

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/windows/*

