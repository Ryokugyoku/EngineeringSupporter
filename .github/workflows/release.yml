name: Build and Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish WinUI
        run: |
          dotnet publish EngineeringSupporter.WinUI/EngineeringSupporter.WinUI.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -o ./publish

      - name: Velopack Pack
        run: |
          vpk pack -u EngineeringSupporter -v ${{ github.ref_name }} -p ./publish -e EngineeringSupporter.WinUI.exe --packTitle "EngineeringSupporter"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: ./Releases/*

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-windows]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/windows-releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
